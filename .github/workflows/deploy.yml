# localchune — MIT licensed. See LICENSE.
# Manual app-Worker deploy from GitHub's runners. Exists because Cloudflare's
# API edge bot-challenges large script uploads from some residential IPs
# (observed 2026-07-29: HTML challenge page on POST /workers/scripts/*/versions,
# while small uploads pass) — CI runners are never challenged.
#
# workflow_dispatch only: deploys stay a human decision, same policy as
# ci.yml. Fork PRs can never reach this (no pull_request trigger, and GitHub
# withholds secrets from forks regardless).
#
# Secrets: CLOUDFLARE_API_TOKEN (Workers Scripts:Edit, single account),
# PUBLIC_SUPABASE_URL + PUBLIC_SUPABASE_ANON_KEY (build-time inlines; both
# already ship in every page's client bundle — stored as secrets for tidiness,
# not confidentiality). DB migrations are NOT run here — apply them first,
# per CLAUDE.md's migrations-before-deploy rule.
name: deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: astro build + wrangler deploy (app Worker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro build
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 75b6ab7ee7a297043ad3e90490cb4094
